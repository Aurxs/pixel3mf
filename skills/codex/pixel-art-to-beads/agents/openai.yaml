interface:
  display_name: "像素画转拼豆图纸"
  short_description: "拼豆图纸与角色封面：官方原画背景、苹方细体名字与柔光"
  default_prompt: "使用 $pixel-art-to-beads，把这张像素画制作成拼豆图纸：逻辑宽高均不超过52时只交原向与镜像两张；任一边超过52时再加52×52压缩原向与镜像，共四张。自然效果优先，约18色，不强制凑色。角色封面复用生图时对应角色和服装的官方原画作高斯模糊背景，等比保留更多角色与场景信息，避免背景脸部过大；清晰拼豆前景限制在画布宽60%、高52%内，背景稍提亮且不洗白，角色外侧加柔和高光，下方用环境已有的苹方细体显示白色「中文角色名」，无文字描边、渐变或阴影。核验 PingFangSC-Light 字面及引号字形；缺字体时明确报告，不冒称替代字体是苹方，不复制或打包苹果字体。样张等待用户审美反馈，不自动视为已批准。图纸标题中文为主，日文名可括号补充；文案用简洁模板：标题为角色名拼豆图纸｜附镜像，正文列角色、尺寸、色数、豆数、实际图序与色卡，有52板时分别列准确数据，不要求个性化感想，话题建议放正文外。不改历史作品。未知中文名查正式来源或按用户中文称呼，不自动翻译。"
policy:
  allow_implicit_invocation: true
