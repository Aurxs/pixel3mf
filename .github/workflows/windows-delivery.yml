name: Build Windows delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-install-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows entry scripts
        shell: powershell
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Run the end-user installer
        shell: powershell
        run: ./windows/install.ps1
      - name: Keep install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-log
          path: output/setup/*.log
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: windows-install-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive the complete project source
        run: |
          mkdir -p output/windows-delivery
          git archive --format=zip --prefix=pixel3mf/ --output=output/windows-delivery/pixel3mf-windows.zip HEAD
          unzip -t output/windows-delivery/pixel3mf-windows.zip
      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pixel3mf-windows-delivery
          path: output/windows-delivery/pixel3mf-windows.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
