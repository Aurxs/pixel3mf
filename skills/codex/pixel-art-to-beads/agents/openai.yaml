interface:
  display_name: "像素画转拼豆图纸"
  short_description: "按尺寸交付两张或四张拼豆图纸，并复用角色官方原画制作模糊背景封面"
  default_prompt: "使用 $pixel-art-to-beads，把这张像素画制作成拼豆图纸：逻辑宽高均不超过52时只交原向与镜像两张；任一边超过52时再加52×52压缩原向与镜像，共四张。自然效果优先，约18色，不强制凑色。角色封面复用生图时对应角色和服装的官方原画作高斯模糊背景，等比保留更多角色与场景信息，避免背景脸部过大；清晰拼豆前景限制在画布宽60%、高52%内，背景稍提亮且不洗白，不加底部文字。图纸标题中文为主，日文名可括号补充；若需小红书文案，标题正文纯中文。未知中文名查正式来源或按用户中文称呼，不自动翻译。"
policy:
  allow_implicit_invocation: true
